# Contradiction resolution scenarios — verify that the system detects and
# resolves contradictions between memories.

scenarios:
  - name: duplicate_candidate_skipped
    description: >
      If a candidate has the same predicate and value as an existing memory,
      it is classified as a duplicate and should be skipped.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: I like TypeScript.
      - id: msg-2
        role: user
        content: I like TypeScript.
    expected_candidates:
      - memory_type: preference
        subject_key: code
        predicate: code_language
        value: TypeScript
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
    expected_memories:
      - memory_type: preference
        subject_key: code
        predicate: code_language
        value: TypeScript
        status: active
        version: 1
    expected_queries: []

  - name: preference_change_supersedes_old
    description: >
      A user changes their preference. The new value should supersede the old
      one. The old memory is marked superseded.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: I prefer JavaScript.
      - id: msg-2
        role: user
        content: Actually, I prefer TypeScript now.
    expected_candidates:
      - memory_type: preference
        subject_key: code
        predicate: code_language
        value: TypeScript
        source_message_id: msg-2
        explicitly_stated: true
        sensitivity: public
    expected_memories:
      - memory_type: preference
        subject_key: code
        predicate: code_language
        value: TypeScript
        status: active
        version: 1
    expected_queries: []

  - name: contradictory_semantic_facts_flagged
    description: >
      Contradictory semantic facts about the same predicate but different
      values should be flagged for review (pending_review).
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - semantic
      allowed_sensitivity:
        - public
    messages:
      - id: msg-1
        role: user
        content: My current employer is Acme Corp.
      - id: msg-2
        role: user
        content: I work for Beta Inc now.
    expected_candidates:
      - memory_type: semantic
        subject_key: employment
        predicate: employer
        value: Beta Inc
        source_message_id: msg-2
        explicitly_stated: true
        sensitivity: public
    expected_queries: []

  - name: supporting_facts_not_conflicting
    description: >
      Facts that describe different aspects of the same subject are
      supporting, not contradictory.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: My name is John.
      - id: msg-2
        role: user
        content: I work as an engineer.
    expected_candidates:
      - memory_type: semantic
        subject_key: user
        predicate: name
        value: John
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
      - memory_type: semantic
        subject_key: employment
        predicate: job_title
        value: engineer
        source_message_id: msg-2
        explicitly_stated: true
        sensitivity: public
    expected_queries: []