{% extends "base.html" %}

{% block title %}Consent - Agent Memory Lab{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-bold text-gray-800">Consent Management</h2>
    <p class="text-gray-600 mt-1">Grant and revoke subject consent</p>
</div>

<!-- Grant Form -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Grant Consent</h3>
    <form id="grantForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject ID</label>
                <input type="text" id="grantSubjectId" value="user-1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Memory Types (comma-separated)</label>
                <input type="text" id="grantTypes" value="preference, semantic" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sensitivity</label>
                <select id="grantSensitivity" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="public">Public</option>
                    <option value="internal">Internal</option>
                    <option value="restricted">Restricted</option>
                    <option value="confidential">Confidential</option>
                </select>
            </div>
        </div>
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 transition-colors">
            Grant Consent
        </button>
    </form>
    <div id="grantStatus" class="mt-2 hidden"></div>
</div>

<!-- Revoke Form -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Revoke Consent</h3>
    <form id="revokeForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject ID</label>
                <input type="text" id="revokeSubjectId" value="user-1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Memory Type (optional - omit for all)</label>
                <input type="text" id="revokeType" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-md hover:bg-red-700 transition-colors">
            Revoke Consent
        </button>
    </form>
    <div id="revokeStatus" class="mt-2 hidden"></div>
</div>

<!-- Consent Log -->
<div class="bg-white rounded-lg shadow p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Recent Actions</h3>
    <div id="consentLog" class="text-sm text-gray-500">
        <p class="italic">No actions recorded yet.</p>
    </div>
</div>

<script>
function showStatus(id, message, isSuccess) {
    const el = document.getElementById(id);
    el.classList.remove('hidden');
    el.className = isSuccess ? 'mt-2 bg-green-50 border border-green-200 rounded-md p-3 text-green-700' : 'mt-2 bg-red-50 border border-red-200 rounded-md p-3 text-red-700';
    el.textContent = message;
}

document.getElementById('grantForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        subject_id: document.getElementById('grantSubjectId').value,
        memory_types: document.getElementById('grantTypes').value.split(',').map(t => t.trim()).filter(t => t),
        sensitivity: document.getElementById('grantSensitivity').value,
    };
    const res = await fetch('/consent/grant', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    showStatus('grantStatus', result.message || result.error, res.ok);
});

document.getElementById('revokeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = {
        subject_id: document.getElementById('revokeSubjectId').value,
        memory_type: document.getElementById('revokeType').value || null,
    };
    const res = await fetch('/consent/revoke', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    showStatus('revokeStatus', result.message || result.error, res.ok);
});
</script>
{% endblock %}
