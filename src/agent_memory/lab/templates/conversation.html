{% extends "base.html" %}

{% block title %}Conversation - Agent Memory Lab{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-bold text-gray-800">Conversation Simulation</h2>
    <p class="text-gray-600 mt-1">Simulate a conversation and extract memories</p>
</div>

<!-- Input Form -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <form id="simulateForm" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Agent ID</label>
            <input type="text" id="agentId" value="agent-1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Conversation Messages (JSON)</label>
            <textarea id="messages" rows="8" class="w-full px-3 py-2 border border-gray-300 rounded-md font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{
  "messages": [
    {"role": "user", "content": "I really enjoy drinking coffee in the morning."},
    {"role": "assistant", "content": "That's great! I'll remember you like coffee."}
  ]
}</textarea>
        </div>

        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors">
            Run Extraction
        </button>
    </form>
</div>

<!-- Results -->
<div id="results" class="hidden">
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Extraction Results</h3>

        <!-- Errors -->
        <div id="errors" class="hidden mb-4 bg-red-50 border border-red-200 rounded-md p-4">
            <h4 class="text-red-800 font-medium mb-2">Errors</h4>
            <ul id="errorsList" class="list-disc list-inside text-red-700"></ul>
        </div>

        <!-- Candidates -->
        <div id="candidates" class="mb-4">
            <h4 class="text-gray-700 font-medium mb-2">Extracted Memories</h4>
            <div id="candidatesList" class="space-y-3"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('simulateForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const agentId = document.getElementById('agentId').value;
    let messages;
    try {
        const data = JSON.parse(document.getElementById('messages').value);
        messages = data.messages || data;
    } catch (err) {
        alert('Invalid JSON in messages field');
        return;
    }

    const response = await fetch('/conversation/simulate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({messages, agent_id: agentId})
    });

    const result = await response.json();

    // Show results
    document.getElementById('results').classList.remove('hidden');

    // Errors
    const errorsDiv = document.getElementById('errors');
    const errorsList = document.getElementById('errorsList');
    if (result.errors && result.errors.length > 0) {
        errorsDiv.classList.remove('hidden');
        errorsList.innerHTML = result.errors.map(e => `<li>${e}</li>`).join('');
    } else {
        errorsDiv.classList.add('hidden');
    }

    // Candidates
    const candidatesList = document.getElementById('candidatesList');
    if (result.extracted && result.extracted.length > 0) {
        candidatesList.innerHTML = result.extracted.map(c => `
            <div class="bg-gray-50 rounded-md p-4 border border-gray-200">
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div><span class="font-medium text-gray-600">Type:</span> ${c.memory_type || 'N/A'}</div>
                    <div><span class="font-medium text-gray-600">Predicate:</span> ${c.predicate || 'N/A'}</div>
                    <div><span class="font-medium text-gray-600">Value:</span> ${c.value || 'N/A'}</div>
                    <div><span class="font-medium text-gray-600">Score:</span> ${c.score?.toFixed(2) || 'N/A'}</div>
                </div>
            </div>
        `).join('');
    } else {
        candidatesList.innerHTML = '<p class="text-gray-500 italic">No memories extracted.</p>';
    }
});
</script>
{% endblock %}
