{% extends "base.html" %}

{% block title %}Retrieval - Agent Memory Lab{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-bold text-gray-800">Memory Retrieval</h2>
    <p class="text-gray-600 mt-1">Search and retrieve memories</p>
</div>

<!-- Search Form -->
<div class="bg-white rounded-lg shadow p-6 mb-6">
    <form id="retrieveForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Query</label>
                <input type="text" id="query" placeholder="Search query..." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Subject ID</label>
                <input type="text" id="subjectId" value="default" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Max Tokens</label>
                <input type="number" id="maxTokens" value="1200" min="100" max="10000" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Memory Types (comma-separated)</label>
            <input type="text" id="memoryTypes" placeholder="preference, semantic (optional)" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition-colors">
            Search
        </button>
    </form>
</div>

<!-- Results -->
<div id="results" class="hidden">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-800">Results</h3>
            <span class="text-sm text-gray-500" id="resultCount"></span>
            <span class="text-sm text-gray-500 ml-4" id="tokenCount"></span>
        </div>
        <div id="resultsList" class="space-y-3"></div>
    </div>
</div>

<script>
document.getElementById('retrieveForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const query = document.getElementById('query').value;
    const subjectId = document.getElementById('subjectId').value;
    const maxTokens = parseInt(document.getElementById('maxTokens').value);
    const memoryTypesStr = document.getElementById('memoryTypes').value.trim();
    const memoryTypes = memoryTypesStr ? memoryTypesStr.split(',').map(t => t.trim()) : null;

    const body = {
        query,
        subject_id: subjectId,
        max_tokens: maxTokens,
    };
    if (memoryTypes) body.memory_types = memoryTypes;

    const response = await fetch('/retrieve/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });

    const result = await response.json();

    document.getElementById('results').classList.remove('hidden');
    document.getElementById('resultCount').textContent = `${result.total_count || 0} results`;
    document.getElementById('tokenCount').textContent = `${result.tokens_used || 0} tokens used`;

    const resultsList = document.getElementById('resultsList');
    if (result.results && result.results.length > 0) {
        resultsList.innerHTML = result.results.map(r => `
            <div class="bg-gray-50 rounded-md p-4 border border-gray-200">
                <div class="flex items-start justify-between">
                    <div>
                        <span class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-medium">${r.memory_type || 'unknown'}</span>
                        <h4 class="mt-2 font-medium text-gray-800">${r.predicate || 'N/A'}</h4>
                        <p class="text-gray-600 mt-1">${r.value || 'N/A'}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-medium text-green-600">Score: ${r.score?.toFixed(2) || '0.00'}</span>
                        <p class="text-xs text-gray-500 mt-1">Conf: ${r.confidence?.toFixed(2) || '0.00'}</p>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        resultsList.innerHTML = '<p class="text-gray-500 italic text-center py-4">No results found.</p>';
    }
});
</script>
{% endblock %}
