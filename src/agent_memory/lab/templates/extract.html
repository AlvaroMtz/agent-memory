{% extends "base.html" %}

{% block title %}Extraction - Agent Memory Lab{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-bold text-gray-800">Extraction</h2>
    <p class="text-gray-600 mt-1">Review extracted memory candidates</p>
</div>

<div class="bg-white rounded-lg shadow p-6">
    <div class="text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-700">No extraction results</h3>
        <p class="mt-1 text-sm text-gray-500">Run a conversation simulation first to see extraction results here.</p>
        <div class="mt-6">
            <a href="/conversation" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                Go to Conversation
            </a>
        </div>
    </div>
</div>
{% endblock %}
