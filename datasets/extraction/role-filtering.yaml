# Extraction scenarios — verify that extractors correctly identify memories
# from qualifying message roles (user, trusted_tool) and reject non-qualifying
# roles (assistant, system, developer, tool).

scenarios:
  - name: extract_user_preference
    description: >
      A user states a language preference. The extractor should produce a
      preference candidate with valid evidence.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: I prefer responses in English.
    expected_candidates:
      - memory_type: preference
        subject_key: language
        predicate: response_language
        value: English
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
    expected_queries: []

  - name: extract_semantic_fact
    description: >
      A user shares a personal fact. The extractor should produce a semantic
      candidate with the fact value and evidence.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: My favorite color is blue.
    expected_candidates:
      - memory_type: semantic
        subject_key: user
        predicate: favorite_color
        value: blue
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
    expected_queries: []

  - name: extract_trusted_tool_preference
    description: >
      A trusted_tool message sets a preference. Should be extracted.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: trusted_tool
        content: "Detected user prefers dark mode: true"
    expected_candidates:
      - memory_type: preference
        subject_key: theme
        predicate: dark_mode
        value: true
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
    expected_queries: []

  - name: reject_assistant_message
    description: >
      An assistant message should never be extracted. Expect zero candidates.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
      allowed_sensitivity:
        - public
    messages:
      - id: msg-1
        role: assistant
        content: I think you would like Python.
    expected_queries: []
    expected_to_fail: false

  - name: reject_system_message
    description: >
      A system message should never be extracted.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
      allowed_sensitivity:
        - public
    messages:
      - id: msg-1
        role: system
        content: "System initialized. User preferences: {language: English}"
    expected_queries: []
    expected_to_fail: false

  - name: reject_mixed_roles
    description: >
      Only user and trusted_tool messages produce candidates. Assistant and
      system messages are ignored.
    context:
      tenant_id: tenant-a
      subject_id: subject-1
      purpose: testing
    consent:
      purpose: testing
      allow_write: true
      allow_read: true
      allowed_memory_types:
        - preference
        - semantic
      allowed_sensitivity:
        - public
        - internal
    messages:
      - id: msg-1
        role: user
        content: I like fast responses.
      - id: msg-2
        role: assistant
        content: Sure, I will answer quickly.
      - id: msg-3
        role: user
        content: Please use simple language.
      - id: msg-4
        role: system
        content: "System ready"
    expected_candidates:
      - memory_type: preference
        subject_key: response
        predicate: response_length
        value: fast
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
      - memory_type: preference
        subject_key: language
        predicate: code_language
        value: simple
        source_message_id: msg-3
        explicitly_stated: true
        sensitivity: public
    expected_queries: []