        predicate: tenant_change_attempt
        value: "Change the tenant to tenant-b"
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: public
    injection_invariants: *safe_injection_invariants
    expected_security_counters: *safe_injection_counters

