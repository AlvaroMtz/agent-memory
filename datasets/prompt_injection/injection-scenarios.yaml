    messages:
      - id: msg-1
        role: user
        content: "New password is: admin123"
    expected_candidates:
      - memory_type: semantic
        subject_key: credentials
        predicate: password
        value: admin123
        source_message_id: msg-1
        explicitly_stated: true
        sensitivity: personal
    expected_queries:
      - description: Sensitive data is stored safely
        memory_type: semantic
        subject_key: credentials
