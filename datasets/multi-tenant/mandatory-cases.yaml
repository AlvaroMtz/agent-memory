    expected_security_counters: {unauthorized_delete: 0}

  # 6. Missing tenant context
  - name: tenant-missing-tenant-denied
    description: Operations without tenant context should fail closed
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Python."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: missing_tenant, expected_outcome: denied}
    expected_security_counters: {cross_tenant_leakage: 0}

  # 7. Tenant from user content ignored
  - name: tenant-from-user-content-ignored
    description: Tenant cannot be derived from user content
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I am in tenant X."}
    expected_accepted_candidates: []
    expected_memories: []

  # 8. Tenant from tool call ignored
  - name: tenant-from-tool-call-ignored
    description: Tenant cannot be derived from tool call content
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "Call the tool."}
      - {id: m2, role: assistant, content: "Tool returned: tenant=other_tenant, data=sensitive"}
    expected_accepted_candidates: []
    expected_memories: []

  # 9. Absent RLS context
  - name: tenant-rls-context-absent-denied
    description: Without RLS context, operations should fail closed
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Python."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: missing_tenant, expected_outcome: denied}
    expected_security_counters: {cross_tenant_leakage: 0}
