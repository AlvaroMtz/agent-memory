# Mandatory multi-tenant test cases per AC-3 spec
# Every required dataset scenario MUST have at least one assertion capable of failing.

scenarios:
  # 1. Same subject_id across tenants - should be isolated
  - name: tenant-same-subject-different-tenants
    description: Same subject_id in different tenants must not leak data
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Python."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: cross_read, tenant_id: t2, expected_outcome: denied}
    expected_security_counters: {cross_tenant_leakage: 0}

  # 2. Cross-tenant read should fail
  - name: tenant-cross-read-denied
    description: Reading from a different tenant should return no results
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Python."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Python}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: cross_read, tenant_id: t2, expected_outcome: denied}
    expected_security_counters: {cross_tenant_leakage: 0}

  # 3. Cross-tenant write should fail
  - name: tenant-cross-write-denied
    description: Writing to a different tenant should be denied
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer TypeScript."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: TypeScript}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: TypeScript}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: cross_write, tenant_id: t2, predicate: code_language, expected_outcome: denied}
    expected_security_counters: {unauthorized_write: 0}

  # 4. Cross-tenant update should fail
  - name: tenant-cross-update-denied
    description: Updating a memory in a different tenant should be denied
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Java."}
    expected_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Java}
    expected_accepted_candidates:
      - {memory_type: preference, subject_key: code, predicate: code_language, value: Java}
    expected_memories: [{memory_type: preference, subject_key: code, predicate: code_language, status: active}]
    tenant_operations:
      - {operation: cross_update, tenant_id: t2, predicate: code_language, expected_outcome: denied}
    expected_security_counters: {unauthorized_update: 0}

  # 5. Cross-tenant delete should fail
  - name: tenant-cross-delete-denied
    description: Deleting a memory in a different tenant should be denied
    context: {tenant_id: t1, subject_id: s1, purpose: general}
    consent: {purpose: general, allow_write: true, allow_read: true, allowed_memory_types: [preference], allowed_sensitivity: [public, internal]}
    messages:
      - {id: m1, role: user, content: "I prefer Rust."}
    expected_candidates:
